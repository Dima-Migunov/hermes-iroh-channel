[project]
name = "iroh-channel"
version = "1.4.2"
description = "Peer-to-peer Iroh channel platform plugin for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "iroh>=1.2,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
