name: iroh-channel
label: Iroh Channel
kind: platform
version: 1.3.0
description: >
  Peer-to-peer Iroh channel for Hermes Agent. Clients dial the node by ticket and
  exchange newline-delimited JSON frames over an authenticated QUIC connection.
author: iroh-channel contributors
tags:
  - platform
  - iroh
  - p2p
  - quic
  - channel
optional_env:
  - name: HERMES_IROH_ALLOWLIST
    description: >
      Comma- or whitespace-separated client node ids, unioned with
      allowlist.json. An empty allowlist denies every client.
    prompt: Bootstrap client node ids (comma-separated, or empty)
    password: false
  - name: HERMES_IROH_RELAY
    description: >
      Relay mode: empty for the n0 default relays, disabled/off/none to disable
      relaying, or a comma-separated list of http(s) relay URLs.
    prompt: Relay mode or relay URLs (or empty for the default)
    password: false
  - name: HERMES_IROH_TURN_TIMEOUT
    description: "Seconds to wait for a gateway turn before the stream fails with timeout"
    prompt: Turn timeout in seconds (default 600)
    password: false
  - name: HERMES_IROH_MAX_PENDING_HANDSHAKES
    description: "Concurrent incoming handshakes admitted before excess connections are refused"
    prompt: Maximum pending handshakes (default 32)
    password: false
  - name: HERMES_IROH_MAX_STREAMS_PER_NODE
    description: "Concurrent prompts allowed per authenticated client node id"
    prompt: Maximum concurrent streams per node (default 2)
    password: false
  - name: HERMES_IROH_MAX_PROMPTS_PER_MINUTE
    description: "Prompts allowed per authenticated client node id in a 60-second window"
    prompt: Maximum prompts per node per minute (default 30)
    password: false
  - name: HERMES_IROH_MAX_RESPONSE_BYTES
    description: "Response content bytes forwarded per turn before response_too_large"
    prompt: Maximum response bytes per turn (default 4194304)
    password: false
