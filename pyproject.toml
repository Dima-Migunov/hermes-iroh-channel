[project]
name = "iroh-channel"
version = "1.0.0"
description = "Peer-to-peer Iroh channel platform plugin for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "iroh>=1.2,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
